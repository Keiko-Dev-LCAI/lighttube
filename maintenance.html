<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightTube — Under Maintenance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 16px;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 20px;
      color: #a0aec0;
      margin-bottom: 48px;
      max-width: 480px;
      line-height: 1.6;
    }

    .card {
      background: #14142a;
      border: 1px solid #2d2d5e;
      border-radius: 16px;
      padding: 36px 48px;
      max-width: 520px;
      width: 100%;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f59e0b;
      animation: blink 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .status-text {
      font-size: 16px;
      color: #f59e0b;
      font-weight: 600;
    }

    .message {
      font-size: 17px;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .divider {
      border: none;
      border-top: 1px solid #2d2d5e;
      margin: 0 0 28px;
    }

    .footer-text {
      font-size: 15px;
      color: #64748b;
    }

    .footer-text span {
      color: #7c3aed;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="logo">⚡</div>
  <h1>LightTube</h1>
  <p class="subtitle">Blockchain video platform on Lightchain AI</p>

  <div class="card">
    <div class="status-row">
      <div class="status-dot"></div>
      <span class="status-text">Temporarily Offline for Upgrades</span>
    </div>

    <p class="message">
      We're making some important improvements to LightTube.
      The platform will be back shortly — better than ever.
    </p>

    <hr class="divider">

    <p class="footer-text">Powered by <span>Lightchain AI</span></p>
  </div>

</body>
</html>
